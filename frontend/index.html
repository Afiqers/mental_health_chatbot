<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <i class="fa-solid fa-spa"></i>
                <h1>Chatbot</h1>
            </div>

            <div class="history-section">
                <h2>Chat History</h2>
                <ul class="history-list">
                    <li class="active-chat"><i class="fa-regular fa-message"></i> Welcome Chat</li>
                    <li><i class="fa-regular fa-message"></i> Stress Relief</li>
                    <li><i class="fa-regular fa-message"></i> Meditation Tips</li>
                </ul>
            </div>

            <div class="user-profile">
                <div class="avatar">
                    <i class="fa-solid fa-user"></i>
                </div>
                <span>User</span>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <h2>Welcome to Chatbot</h2>
                <p>Your safe space to talk and relax.</p>
            </header>

            <div class="messages-container" id="messages-container">
                <!-- Example Response -->
                <div class="message bot-message">
                    <div class="message-content">
                        Hello! I'm Chatbot. How are you feeling today?
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
                    <button id="send-btn" class="send-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
