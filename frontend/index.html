<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <i class="fa-solid fa-spa"></i>
                <h1>Chatbot</h1>
            </div>

            <div class="history-section">
                <h2>Chat History</h2>
                <ul class="history-list">
                    <li class="active-chat"><i class="fa-regular fa-message"></i> Welcome Chat</li>
                    <li><i class="fa-regular fa-message"></i> Stress Relief</li>
                    <li><i class="fa-regular fa-message"></i> Meditation Tips</li>
                </ul>
            </div>

            <button class="new-chat-btn" id="new-chat-btn">
                <i class="fa-solid fa-plus"></i> New Chat
            </button>

            <div style="flex-grow: 1;"></div>

            <!-- Auth Section -->
            <div class="auth-section" id="auth-section">
                <button class="auth-btn" id="login-modal-btn">Log In</button>
                <button class="auth-btn" id="register-modal-btn">Sign Up</button>
            </div>

            <div class="user-profile hidden" id="user-profile">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <span id="username-display">User</span>
                <button id="logout-btn" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <h2>Welcome to Chatbot</h2>
                <p>Your safe space to talk and relax.</p>
            </header>

            <div class="messages-container" id="messages-container">
                <!-- Example Response -->
                <div class="message bot-message">
                    <div class="message-content">
                        Hello! How are you feeling today?
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
                    <button id="send-btn" class="send-btn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Auth Modal (Shared for Login and Register) -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="close-modal">&times;</span>
            <h2 id="modal-title">Log In</h2>
            <div class="form-group">
                <input type="text" id="auth-username" placeholder="Username" autocomplete="off">
            </div>
            <div class="form-group">
                <input type="password" id="auth-password" placeholder="Password">
            </div>
            <button class="submit-btn" id="auth-submit-btn">Submit</button>
            <div class="error-msg" id="auth-error"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
